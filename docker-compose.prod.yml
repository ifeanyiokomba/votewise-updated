# ============================================================
# VoteWise — Production Docker Compose
# ============================================================
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires: .env.production with all secrets filled in

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votewise-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - votewise-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  results-service:
    build:
      context: ./mini-services/results-service
      dockerfile: Dockerfile
    container_name: votewise-results
    restart: unless-stopped
    ports:
      - "3030:3030"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - votewise-net

  db:
    image: postgres:16-alpine
    container_name: votewise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-votewise}
      POSTGRES_USER: ${POSTGRES_USER:-votewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - votewise-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-votewise}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: votewise-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - votewise-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: votewise-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - results-service
    networks:
      - votewise-net

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  votewise-net:
    driver: bridge
